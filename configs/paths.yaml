# paths.yaml
# WHY: The original notebooks hard-coded absolute Google-Drive paths everywhere.
# This file is the single place that defines where data and outputs live. All
# paths are relative to the repository root and resolved by src/utils/config.py,
# so the repo is portable across machines. Override per-machine values in an
# (untracked) config.local.yaml rather than editing this file.
paths:
  data_raw: data/raw            # immutable input CSVs (not committed)
  data_interim: data/interim    # intermediate, regenerable artefacts
  data_processed: data/processed  # cleaned, analysis-ready tables
  data_metadata: data/metadata  # dataset descriptions / dictionaries
  results_figures: results/figures
  results_tables: results/tables
  results_models: results/models
  results_outputs: results/outputs
